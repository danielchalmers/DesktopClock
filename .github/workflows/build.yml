name: CI

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5

      - name: Restore
        shell: bash
        run: dotnet restore

      - name: Check Formatting
        shell: bash
        run: dotnet format --verify-no-changes --no-restore

  build-test:
    name: Build and test
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/build-and-test

      - name: Upload TRX test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: trx-test-results
          if-no-files-found: warn
          path: TestResults/**

  package:
    name: Package ${{ matrix.arch }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/create-release-artifacts
        with:
          arch: ${{ matrix.arch }}

  smoke-test:
    name: Smoke test ${{ matrix.arch }}
    needs: package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: desktopclock-${{ matrix.arch }}
          path: artifact

      - uses: ./.github/actions/smoke-test
        with:
          msi: artifact/DesktopClock-0.0.0-${{ matrix.arch }}.msi
          exe: '%LOCALAPPDATA%\DesktopClock\DesktopClock.exe'
          logs: '%LOCALAPPDATA%\DesktopClock\*.log'
