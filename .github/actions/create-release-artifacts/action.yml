name: Create release artifacts

description: Creates release-ready binaries and uploads them as artifacts.

inputs:
  version:
    description: 'Version number'
    default: '0.0.0'
  arch:
    description: 'Architecture for the build'
    default: 'x64'

runs:
  using: "composite"
  steps:
    - uses: actions/setup-dotnet@v5

    # The installer takes its version from the exe and its exe from publish/<arch>, so it only needs the architecture.
    # Building it for that architecture makes Windows refuse the Arm64 installer on an x64 PC instead of installing an exe that can't start.
    # WiX v7 won't build until its OSMF EULA is accepted, and -acceptEula accepts it for this run only.
    - name: Create binaries
      shell: bash
      run: |
        dotnet tool install --global wix --version 7.0.1
        dotnet publish ./DesktopClock/DesktopClock.csproj -o "publish/${{ inputs.arch }}" -c Release --os win --arch "${{ inputs.arch }}" -p:Version="${{ inputs.version }}"
        wix build Package.wxs -arch "${{ inputs.arch }}" -acceptEula wix7 -o "publish/DesktopClock-${{ inputs.version }}-${{ inputs.arch }}.msi"

    - name: Create portable ZIP
      shell: pwsh
      run: Compress-Archive -Path "publish/${{ inputs.arch }}/DesktopClock.exe" -DestinationPath "publish/DesktopClock-${{ inputs.version }}-${{ inputs.arch }}.zip" -Force

    - uses: actions/upload-artifact@v7
      with:
        name: desktopclock-${{ inputs.arch }}
        if-no-files-found: error
        path: |
          publish/*.zip
          publish/*.msi
