name: Smoke test

description: Installs the MSI, checks that the app starts natively on the runner's architecture and keeps running without showing a message box, and uninstalls it.

inputs:
  msi:
    description: 'Path to the MSI'
    required: true
  exe:
    description: 'Where the MSI installs the exe, such as %LOCALAPPDATA%\App\App.exe'
    required: true

runs:
  using: "composite"
  steps:
    - name: Install, start and uninstall
      shell: pwsh
      env:
        MSI: ${{ inputs.msi }}
        EXE: ${{ inputs.exe }}
      run: |
        $ErrorActionPreference = 'Stop'
        $out = (New-Item -ItemType Directory -Force smoke-test).FullName
        $msi = (Resolve-Path $env:MSI).Path
        $exe = [Environment]::ExpandEnvironmentVariables($env:EXE)
        $name = [IO.Path]::GetFileNameWithoutExtension($exe)

        Add-Type -AssemblyName System.Drawing
        Add-Type -TypeDefinition @'
        using System;
        using System.Collections.Generic;
        using System.Runtime.InteropServices;
        using System.Text;

        public static class SmokeTest
        {
            [StructLayout(LayoutKind.Sequential)]
            private struct ProcessMachineInformation { public ushort ProcessMachine; public ushort Reserved; public uint MachineAttributes; }

            [StructLayout(LayoutKind.Sequential)]
            public struct Rect { public int Left, Top, Right, Bottom; }

            private delegate bool EnumWindowsProc(IntPtr hwnd, IntPtr lParam);

            [DllImport("kernel32.dll", SetLastError = true)]
            private static extern bool GetProcessInformation(IntPtr process, int infoClass, out ProcessMachineInformation info, int size);

            [DllImport("user32.dll")]
            private static extern bool EnumWindows(EnumWindowsProc callback, IntPtr lParam);

            [DllImport("user32.dll")]
            private static extern bool EnumChildWindows(IntPtr parent, EnumWindowsProc callback, IntPtr lParam);

            [DllImport("user32.dll")]
            private static extern uint GetWindowThreadProcessId(IntPtr hwnd, out uint processId);

            [DllImport("user32.dll")]
            private static extern bool IsWindowVisible(IntPtr hwnd);

            [DllImport("user32.dll", CharSet = CharSet.Unicode)]
            private static extern int GetClassName(IntPtr hwnd, StringBuilder name, int size);

            [DllImport("user32.dll", CharSet = CharSet.Unicode)]
            private static extern int GetWindowText(IntPtr hwnd, StringBuilder text, int size);

            [DllImport("user32.dll")]
            public static extern bool GetWindowRect(IntPtr hwnd, out Rect rect);

            [DllImport("user32.dll")]
            public static extern bool PrintWindow(IntPtr hwnd, IntPtr hdc, uint flags);

            // Unlike IsWow64Process2, this also tells an x64 process emulated on Arm64 apart from a native one.
            public static ushort ProcessMachine(IntPtr process)
            {
                ProcessMachineInformation info;
                if (!GetProcessInformation(process, 9, out info, Marshal.SizeOf(typeof(ProcessMachineInformation))))
                    throw new System.ComponentModel.Win32Exception();
                return info.ProcessMachine;
            }

            public static List<IntPtr> VisibleWindows(int processId)
            {
                var windows = new List<IntPtr>();
                EnumWindows((hwnd, _) =>
                {
                    uint owner;
                    GetWindowThreadProcessId(hwnd, out owner);
                    if (owner == processId && IsWindowVisible(hwnd))
                        windows.Add(hwnd);
                    return true;
                }, IntPtr.Zero);
                return windows;
            }

            public static string ClassName(IntPtr hwnd)
            {
                var name = new StringBuilder(256);
                GetClassName(hwnd, name, name.Capacity);
                return name.ToString();
            }

            // A window's title and the text of its child controls, which for a message box is its message.
            public static string Text(IntPtr hwnd)
            {
                var texts = new List<string>();
                EnumWindowsProc add = (child, _) =>
                {
                    var text = new StringBuilder(4096);
                    if (GetWindowText(child, text, text.Capacity) > 0)
                        texts.Add(text.ToString());
                    return true;
                };
                add(hwnd, IntPtr.Zero);
                EnumChildWindows(hwnd, add, IntPtr.Zero);
                return string.Join(" | ", texts);
            }
        }
        '@

        function Msi($arguments, $log) {
          $p = Start-Process msiexec.exe -ArgumentList "$arguments /qn /l*v `"$out\$log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec $arguments failed with exit code $($p.ExitCode)" }
        }

        # Captures the window itself rather than the screen, since the Arm64 runner opens Windows' privacy settings over everything (actions/runner-images#14069).
        function Capture($hwnd, $path) {
          $rect = New-Object SmokeTest+Rect
          [void][SmokeTest]::GetWindowRect($hwnd, [ref]$rect)
          $bmp = New-Object System.Drawing.Bitmap ([Math]::Max(1, $rect.Right - $rect.Left)), ([Math]::Max(1, $rect.Bottom - $rect.Top))
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $hdc = $g.GetHdc()
          [void][SmokeTest]::PrintWindow($hwnd, $hdc, 2)
          $g.ReleaseHdc($hdc)
          $g.Dispose()
          $bmp.Save($path)
          $bmp.Dispose()
        }

        try {
          Msi "/i `"$msi`"" install.log
          if (-not (Test-Path $exe)) { throw "The MSI didn't install $exe" }

          # Not every installer starts its app after a silent install.
          Start-Sleep 5
          if (-not (Get-Process $name -ErrorAction SilentlyContinue)) { Start-Process $exe }

          # Long enough to finish starting up and to show an error if it hit one.
          Start-Sleep 20
          $process = @(Get-Process $name -ErrorAction SilentlyContinue)
          if ($process.Count -ne 1) { throw "Expected one $name process but found $($process.Count)" }

          $expected = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 0xAA64 } else { 0x8664 }
          $machine = [SmokeTest]::ProcessMachine($process[0].Handle)
          if ($machine -ne $expected) { throw ('{0} is running as machine type 0x{1:X4} instead of 0x{2:X4}' -f $name, $machine, $expected) }
          "$name is running natively"

          $messageBox = $false
          $i = 0
          foreach ($hwnd in [SmokeTest]::VisibleWindows($process[0].Id)) {
            $class = [SmokeTest]::ClassName($hwnd)
            "Window $i ($class): $([SmokeTest]::Text($hwnd))"
            Capture $hwnd "$out\window-$i.png"
            # Message boxes use the standard dialog class, and each app's crash handler shows one before exiting.
            if ($class -eq '#32770') { $messageBox = $true }
            $i++
          }
          if ($messageBox) { throw "$name is showing a message box" }
        }
        finally {
          Get-Process $name -ErrorAction SilentlyContinue | Stop-Process -Force
        }

        Msi "/x `"$msi`"" uninstall.log
        if (Test-Path $exe) { throw "Uninstalling didn't remove $exe" }

    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: smoke-test-${{ runner.arch }}
        path: smoke-test/**
        if-no-files-found: ignore
